description=Config Overhauled is a schema-driven configuration management framework designed for modular Minecraft Mod development.\
\n\
\n\
\n\Key Features:\
\n- Multi-Tiered Scoping:\
\n\     Organize settings across Client, Global, and Level-specific domains.\
\n\
\n- Intelligent Synchronization:\
\n\     Automatic client-server state reconciliation ensures configuration parity.\
\n\
\n- Dynamic Lifecycle Management:\
\n\     Support for real-time registration and removal of level-scoped configurations.\
\n\
\n- Access Control:\
\n\     Built-in edit permission management for secure server-side configuration changes.\
\n\
\n- Automated UI Generation:\
\n\     Instant, fully functional configuration screens generated from your schema definitions.
minecraft_version_range=[1.21.6, 1.21.8]
